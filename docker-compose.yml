services:
  postgres:
    image: postgres:16-alpine
    container_name: supportiq-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: supportiq
      POSTGRES_PASSWORD: supportiq
      POSTGRES_DB: supportiq_dev
    ports:
      - "5432:5432"
    volumes:
      - supportiq_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: supportiq-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - supportiq_redis_data:/data

volumes:
  supportiq_postgres_data:
  supportiq_redis_data:
