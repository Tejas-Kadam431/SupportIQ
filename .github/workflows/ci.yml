name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: supportiq
          POSTGRES_PASSWORD: supportiq
          POSTGRES_DB: supportiq_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U supportiq -d supportiq_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      NODE_ENV: test
      PORT: 4000
      CLIENT_URL: http://localhost:5173
      DATABASE_URL: postgresql://supportiq:supportiq@localhost:5432/supportiq_test?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: test_access_secret_for_ci
      JWT_ACCESS_EXPIRES_IN: 15m
      OPENAI_API_KEY: ""
      OPENAI_MODEL: gpt-4o-mini
      VITE_API_BASE_URL: http://localhost:4000/api/v1
      VITE_SOCKET_URL: http://localhost:4000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --dir apps/api db:generate

      - name: Prepare test database
        run: pnpm --dir apps/api exec prisma db push

      - name: Build API
        run: pnpm --dir apps/api build

      - name: Run API tests
        run: pnpm --dir apps/api test

      - name: Build client
        run: pnpm --dir apps/client build
