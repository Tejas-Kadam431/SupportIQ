name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg16
        env:
          POSTGRES_USER: supportiq
          POSTGRES_PASSWORD: supportiq
          POSTGRES_DB: supportiq_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U supportiq -d supportiq_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7.4.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      SUPPORTIQ_TEST_PGVECTOR: "1"
      SUPPORTIQ_TEST_REDIS: "1"
      SUPPORTIQ_TEST_S3: "1"
      S3_TEST_ENDPOINT: http://127.0.0.1:9000
      NODE_ENV: test
      PORT: 4000
      CLIENT_URL: http://localhost:5173
      DATABASE_URL: postgresql://supportiq:supportiq@localhost:5432/supportiq_test?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: test_access_secret_for_ci
      JWT_ACCESS_EXPIRES_IN: 15m
      OPENAI_API_KEY: ""
      OPENAI_MODEL: gpt-4o-mini
      VITE_API_BASE_URL: http://localhost:4000/api/v1
      VITE_SOCKET_URL: http://localhost:4000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start private S3 test storage
        run: |
          docker build -f tooling/minio-test.Dockerfile -t supportiq-minio-test:local .
          docker run -d --name supportiq-storage -p 127.0.0.1:9000:9000 -e MINIO_ROOT_USER=supportiq-test -e MINIO_ROOT_PASSWORD=isolated-test-only supportiq-minio-test:local server /data
          for attempt in $(seq 1 30); do curl -fsS http://127.0.0.1:9000/minio/health/live && exit 0; sleep 2; done
          exit 1

      - name: Generate Prisma client
        run: pnpm --dir apps/api db:generate

      - name: Prepare test database
        run: pnpm --dir apps/api db:test:migrate

      - name: Build API
        run: pnpm --dir apps/api build

      - name: Run API unit tests
        run: pnpm --dir apps/api test:unit

      - name: Run API integration tests
        run: pnpm --dir apps/api test:integration

      - name: Build client
        run: pnpm --dir apps/client build

      - name: Run client tests
        run: pnpm --dir apps/client exec vitest run --pool=threads --maxWorkers=1
